# Plan D 고정 분석 프로토콜 (결과를 보기 전에 동결)
# 변경 시 decision_log.md 에 날짜/이유/영향을 기록한다.

seed: 20261004

data:
  normal: data/raw/press_data_normal.csv
  outlier: data/raw/press_data_outlier.csv
  channels: [AI0_Vibration, AI1_Vibration, AI2_Current]

windows:
  gap_sec: 0.5          # 이 값을 넘는 간격이면 새 버스트
  length: 10            # 기본 window 길이 (샘플)
  length_sensitivity: [5, 10, 20]
  stride: 1

cv:
  n_blocks: 5           # 정상 20,000행을 시간순 5블록
  # 매 fold: 3블록 학습 / 1블록 calibration / 1블록 정상 holdout

features:
  groups: [A, S, R, O, Q]   # 진폭 / 형태 / 관계 / 수준 / 품질
  # Q는 고장 특징과 분리해 진단용으로만 사용 (§3.1)
  model_groups: [A, S, R, O]

models:
  enabled: [BL0, M1, M2, M3]
  optional: [BL1_LSTMAE, M4_CNNAE]    # TensorFlow/torch 필요
  isolation_forest:
    n_estimators: 200
    max_samples: 256
  pca_mspc:
    var_ratio: 0.95

calibration:
  # p_normal(x) = (1 + #{s_i >= s(x)}) / (n+1)
  yellow_p: 0.01
  red_p: 0.01
  red_consecutive: 3    # 빨강은 연속 3 window

robustness:
  gain: [0.8, 0.9, 1.1, 1.25]
  offset_sigma: [0.1, 0.25, 0.5]     # 학습 정상 표준편차 배수
  polarity: [AI0, AI1, AI2, all]
  jitter_sec: [0.01, 0.02, 0.05]

selection:
  # §6.2 통과 기준 (순서대로 탈락)
  max_recall_drop_pp: 20.0      # 섭동 후 Recall 하락 한계(%p)
  worst_block_fp_vs_bl0: true   # BL-0보다 최악 블록 오경보가 많으면 탈락
  require_burst_detection: true # 이상 버스트 중 최소 1개는 탐지

deep:
  lstm_ae:
    hidden: [64, 32]
    epochs_quick: 0
    epochs_full: 800
    batch_size: 128
    lr: 0.001
    seeds: [0, 1, 2]        # G0 문헌값 재현용
    seeds_cv: [0]           # G1 5-fold CV (DL-004: 계산예산상 1시드)
